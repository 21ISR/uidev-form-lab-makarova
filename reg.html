<body>
    <div>
        <header>
            <h1 class="stud">Student Registration</h1>
            <p class="stud2">Create your student account</p>
        </header>
        <form action="/api/register" method="post">
            <article>
                <h2 class="fullname">Full Name</h2>
                <input type="text" name="fullname" id="fullname" placeholder="Enter your full name" class="fullname">
                        </section>
        <section>
            </article>
            <article>
                <h3 class="fullname">Email Address</h3>
                <input type="email" name="Email Address" id="addres" placeholder="Enter your email" class="fullname">
                        </section>
        <section>
            </article>
            <article>
                <h4 class="fullname">Student ID</h4>
                <input type="text" name="student-id" id="StudId" placeholder="Enter your student ID" class="fullname">
                        </section>
        <section>
            </article>
            <article>
                <h5 class="fullname">Select Program</h5>
                <select id="program" name="program" class="fullname1">
                    <option value="">Choose your Program</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Business">Business</option>
                    <option value="Art">Arts & Humanities</option>
                    <option value="Science">Science</option>
                </select>
                        </section>
        <section>
            </article>
            <article>
                <h6 class="fullname">Password</h6>
                <input type="password" name="password" id="password" placeholder="Create a password" class="fullname">
                        </section>
        <section>
            </article>
            <article>
                <h7 class="fullname">Confirm your Password</h7>
                <input type="password" name="password" id="password-confirm" placeholder="Confirm your password"
                    class="fullname">
                            </section>
        <section>
                <article class="check1">
                    <input type="checkbox" class="box" name="remember" value="yes">
                    <h7 class="iagr">I agree to thr Terms of Service and Privacy Policy
                        </section>
        <section>
                    </h7>
                    
                            </section>
        <section>
                    <button class="log"> Create Account 
                        </section>
        <section>
                    </button>
        </form>
        <article>
            <p class="al">Already have an account? <a class="login" href="index.html">Log in</a></p>
        </article>
    </div>
</body>
</html>
